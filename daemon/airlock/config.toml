# ==========================================================================
# BLS — predictors (Phase C wiring)
# ==========================================================================
# BLS API v2 uses POST with JSON body (not GET).  The fetch_bls method handles
# this; "registrationkey" goes in the POST body, not as a query param.

[sources.bls]
host = "api.bls.gov"
base_url = "https://api.bls.gov/publicAPI/v2/timeseries/data/"
api_key_env = "BLS_API_KEY"
default_series = []

